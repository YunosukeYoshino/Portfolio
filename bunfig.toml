[install]
# Supply-chain hardening: avoid resolving package versions published in the last 3 days.
minimumReleaseAge = 259200
# Keep compiler/runtime type packages unblocked so routine toolchain updates do not stall.
minimumReleaseAgeExcludes = ["@types/bun", "vite-plus", "@voidzero-dev/vite-plus-core", "@voidzero-dev/vite-plus-darwin-arm64", "@voidzero-dev/vite-plus-darwin-x64", "@voidzero-dev/vite-plus-linux-arm64-gnu", "@voidzero-dev/vite-plus-linux-arm64-musl", "@voidzero-dev/vite-plus-linux-x64-gnu", "@voidzero-dev/vite-plus-linux-x64-musl", "@voidzero-dev/vite-plus-win32-arm64-msvc", "@voidzero-dev/vite-plus-win32-x64-msvc"]
# Do not run project or dependency lifecycle scripts during dependency installation.
ignoreScripts = true
# Block transitive dependencies that resolve from non-registry sources when supported by Bun.
blockExoticSubdeps = true
