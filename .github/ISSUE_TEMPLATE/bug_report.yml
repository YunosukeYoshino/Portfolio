name: Bug report
description: Something on the site or in the code is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do not belong here — see
        [SECURITY.md](https://github.com/YunosukeYoshino/Portfolio/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to https://yunosukeyoshino.com/...
        2. ...
        3. See the error
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or Bun version if this is a local build issue
      placeholder: Chrome 140 / macOS 15, or Bun 1.3.12
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
    validations:
      required: false
