name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [repository_dispatch]
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  BUN_VERSION: "latest"
  BUN_INSTALL_FLAGS: "--frozen-lockfile --ignore-scripts"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Workers

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun security feature support
        run: |
          bun --version
          bun -e "const [major, minor] = Bun.version.split('.').map(Number); if (major < 1 || (major === 1 && minor < 3)) { console.error('Bun 1.3+ is required for minimumReleaseAge enforcement'); process.exit(1); }"

      - name: Install dependencies
        run: bun install ${{ env.BUN_INSTALL_FLAGS }}

      - name: Prepare build env
        run: |
          cat > .env.local <<EOF
          MICROCMS_SERVICE_DOMAIN=${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          VITE_SITE_URL=https://yunosukeyoshino.com
          VITE_PUBLIC_SITE_URL=https://yunosukeyoshino.com
          EOF

      - name: Build application
        run: bun run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: https://yunosukeyoshino.com

      - name: Sync worker secrets
        run: |
          cat > .worker-secrets.env <<EOF
          MICROCMS_SERVICE_DOMAIN=${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF
          bunx wrangler secret bulk .worker-secrets.env --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers via Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed assets
        run: bun run verify:deployment https://yunosukeyoshino.com/

      - name: Create deployment status
        if: success()
        run: |
          echo "🚀 Deployment successful!"
          echo "📄 Site URL: https://yunosukeyoshino.com"
